[pytest]
# Run from the bundle root: pytest            (everything)
#                          pytest tests/static  (static checks only, no Spark)
testpaths = tests
pythonpath = src tests
addopts = -ra --import-mode=importlib -p no:cacheprovider
markers =
    spark: needs a Spark session; skipped when none is available
filterwarnings =
    default::UserWarning
